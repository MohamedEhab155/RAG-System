name: Deploy Main Branch to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_MAIN_HOST_IP }}
          username: github_user
          key: ${{ secrets.SSH_MAIN_PRIVATE_KEY }}
          script: |
            cd /home/github_user/workspace/RAG-System
            git checkout main
            git pull origin main
            sudo systemctl restart ragsystem.service
            echo "⏳ Waiting for service to restart..."
            sleep 20
            
            for i in {1..6}; do
              if nc -z localhost 80; then
                echo "✅ Port 80 is active! Deployment successful!"
                exit 0
              else
                echo "⏳ Port 80 not ready, attempt $i/6"
                sleep 5
              fi
            done
            
            echo "❌ Deployment failed: Port 80 did not become active"
            exit 1